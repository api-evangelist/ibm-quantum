openapi: 3.2.0
info:
  title: Qiskit Runtime Versions API
  description: The Qiskit Runtime API description
  version: 0.56.3
  contact: {}
  x-ibm-changelog: '- `GET /api/v1/jobs/:id/metrics` and `GET /api/v1/jobs` return usage data using a different response format. The APIs no longer return the response properties `usage.circuits_execution_time_ns`. Now `GET /api/v1/jobs/:id/metrics` will return `circuits_execution_time_ns` at response root level.'
servers:
- url: /api
tags:
- name: Versions
paths:
  /v1/versions:
    get:
      description: Get a list of available API versions
      operationId: get_versions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
      summary: Get versions
      tags:
      - Versions
components:
  schemas:
    VersionResponse:
      type: object
      properties:
        versions:
          example:
          - version: '2024-01-01'
            sunset_date: '2027-01-01'
            status: deprecated
          - version: '2025-01-01'
            sunset_date: '2027-01-01'
            status: deprecated
          - version: '2025-05-01'
            sunset_date: '2027-01-01'
            status: deprecated
          - version: '2026-02-01'
            sunset_date: '2027-02-01'
            status: deprecated
          - version: '2026-02-15'
            sunset_date: '2027-02-15'
            status: deprecated
          - version: '2026-03-15'
            sunset_date: '2027-03-15'
            status: deprecated
          - version: '2026-04-15'
            status: live
          type: array
          items:
            $ref: '#/components/schemas/VersionMetadata'
      required:
      - versions
    VersionMetadata:
      type: object
      properties:
        version:
          type: string
          description: The API version in `YYYY-MM-DD` format.
          format: date
          minLength: 10
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
        sunset_date:
          type: string
          description: The sunset date of the API version in `YYYY-MM-DD` format. Support may drop at anytime on or after this date.
          format: date
          minLength: 10
          maxLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
        status:
          description: The support status of the API version.
          allOf:
          - $ref: '#/components/schemas/VersionStatus'
      required:
      - version
      - status
    VersionStatus:
      type: string
      enum:
      - live
      - deprecated
      description: The support status of the API version.
  securitySchemes:
    IBMCloudAPIKey:
      type: apiKey
      in: header
      name: Authorization
      description: IBM Cloud Identity and Access Management (IAM) API key. In the format 'apikey &lt;IBM Cloud API Key&gt;'.
    ServiceCRN:
      type: apiKey
      in: header
      name: Service-CRN
      description: The Cloud Resource Name (CRN) of your Qiskit Runtime service instance
    IBMCloudAuth:
      scheme: bearer
      bearerFormat: jwt
      type: http
      description: IBM Cloud Identity and Access Management (IAM) access token
