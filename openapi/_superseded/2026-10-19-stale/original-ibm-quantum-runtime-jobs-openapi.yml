          title: Ssv
          type: integer
        samplex_json:
          description: A JSON string representing the samplex.
          title: Samplex Json
          type: string
      required:
      - ssv
      - samplex_json
      title: SamplexModelSSV1
      type: object
    SamplexModelSSV1ToSSV2:
      description: A samplex model constrained to use samplex serialization versions (SSV) 1 or 2.
      properties:
        ssv:
          maximum: 2
          minimum: 1
          title: Ssv
          type: integer
        samplex_json:
          description: A JSON string representing the samplex.
          title: Samplex Json
          type: string
      required:
      - ssv
      - samplex_json
      title: SamplexModelSSV1ToSSV2
      type: object
    SchedulerTimingModel:
      description: 'Describes the timing of a scheduled circuit.


        All timing information is expressed in terms of multiples of the quantity ``dt``, time step

        duration of the control electronics, which can be queried in backend and target properties.'
      properties:
        timing:
          description: A description of circuit timing in a comma-separated text format.
          title: Timing
          type: string
        circuit_duration:
          description: The duration of the circuit in ``dt`` steps.
          title: Circuit Duration
          type: integer
      required:
      - timing
      - circuit_duration
      title: SchedulerTimingModel
      type: object
    StretchValueModel:
      description: 'Describes circuit stretch value resolutions.


        All timing information is expressed in terms of multiples of the quantity ``dt``, time step

        duration of the control electronics, which can be queried in backend and target properties.'
      properties:
        name:
          description: The name of the stretch.
          title: Name
          type: string
        value:
          description: The resolved stretch value, up to the remainder, in units of ``dt``.
          title: Value
          type: integer
        remainder:
          description: The time left over if ``value`` were to be used each stretch, in units of ``dt``.
          title: Remainder
          type: integer
        expanded_values:
          description: 'A sequence of pairs ``(time [int], duration [int])`` indicating the time and duration of each delay.


            All units are ``dt``, where the ``time`` denotes the absolute time of a delay in the circuit

            schedule, and the ``duration`` denotes the total duration of the delay.'
          items:
            maxItems: 2
            minItems: 2
            type: array
          title: Expanded Values
          type: array
      required:
      - name
      - value
      - remainder
      - expanded_values
      title: StretchValueModel
      type: object
    Tags:
      title: Tags
      description: List of job or program tags
      type: array
      minItems: 0
      maxItems: 8
      items:
        type: string
        pattern: ^.*$
        minLength: 0
        maxLength: 86
    TensorModel:
      description: Model of tensor data.
      properties:
        data:
          description: 'Base-64-encoded data in litte endian format.


            Bool arrays are bitpacked, other types are IEEE753. Everything is little-endian.

            Tensors are C-ordering.'
          title: Data
          type: string
        shape:
          description: The shape of the tensor.
          items:
            type: integer
          title: Shape
          type: array
        dtype:
          description: The data type of the tensor.
          enum:
          - f64
          - bool
          - u8
          - c128
          title: Dtype
          type: string
      required:
      - data
      - shape
      - dtype
      title: TensorModel
      type: object
    Timestamps:
      type: object
      description: A map of status transitions to timestamps
      properties:
        created:
          pattern: ^[0-9TZt:\-+./*]+$
          format: date-time
          type: string
          description: Timestamp of when the job create request was received
        finished:
          pattern: ^[0-9TZt:\-+./*]+$
          format: date-time
          type: string
          description: Timestamp of when the job finished
        running:
          pattern: ^[0-9TZt:\-+./*]+$
          format: date-time
          type: string
          description: Timestamp of when the job started running
    UsageV3:
      title: usage
      description: usage metrics
      type: object
      properties:
        qpu_charge_time_seconds:
          type: number
          description: The amount of resource usage in seconds. This value is used to calculate capacity consumption.
          minimum: 0
        status:
          $ref: '#/components/schemas/BillingStatus'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: IBM Cloud IAM bearer token
    ServiceCRN:
      type: apiKey
      in: header
      name: Service-CRN
      description: IBM Cloud Service CRN identifying the Qiskit Runtime instance
    ApiVersion:
      type: apiKey
      in: header
      name: IBM-API-Version
      description: API version, e.g. 2026-03-15
security:
- BearerAuth: []
  ServiceCRN: []
  ApiVersion: []
