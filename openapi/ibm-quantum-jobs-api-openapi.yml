openapi: 3.2.0
info:
  title: Qiskit Runtime Jobs API
  description: The Qiskit Runtime API description
  version: 0.56.3
  contact: {}
  x-ibm-changelog: '- `GET /api/v1/jobs/:id/metrics` and `GET /api/v1/jobs` return usage data using a different response format. The APIs no longer return the response properties `usage.circuits_execution_time_ns`. Now `GET /api/v1/jobs/:id/metrics` will return `circuits_execution_time_ns` at response root level.'
servers:
- url: /api
tags:
- name: Jobs
paths:
  /v1/jobs/{id}:
    parameters:
    - schema:
        type: string
        minLength: 1
        maxLength: 1000
        pattern: ^.*$
      name: id
      in: path
      required: true
      description: Identifier of an existing job
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      summary: List job details
      tags:
      - Jobs
      description: List the details about the specified quantum program job.
      parameters:
      - in: query
        name: exclude_params
        required: false
        schema:
          type: boolean
          default: false
        description: Exclude job params from the response
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponseV3'
              examples:
                jobResponseSample:
                  $ref: '#/components/examples/jobResponseExample'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      operationId: get_job
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.read
    delete:
      tags:
      - Jobs
      summary: Delete a job
      operationId: delete_job
      responses:
        '204':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '500':
          description: Internal error deleting job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      description: Delete the specified job and its associated data. Job must be in a terminal state.
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.delete
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.delete
  /v1/jobs:
    parameters:
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 200
          minimum: 1
          maximum: 200
        description: Number of results to return at a time. If the provided value is outside of the viable range, no error occurs and the default value is used instead.
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
          maximum: 2147483647
        description: Number of results to offset when retrieving the list of jobs. If the provided value is outside of the viable range, no error occurs and the default value is used instead.
      - in: query
        name: pending
        required: false
        schema:
          type: boolean
        description: Returns 'Queued' and 'Running' jobs if true.  Returns 'Completed', 'Cancelled', and 'Failed' jobs if false.
      - in: query
        name: program
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 63
          pattern: ^.*$
        description: Program ID to filter jobs
      - in: query
        name: backend
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^.*$
        description: Backend to filter jobs
      - in: query
        name: created_after
        required: false
        schema:
          type: string
          format: date-time
          minLength: 1
          maxLength: 100
        description: Job created after filter
      - in: query
        name: created_before
        required: false
        schema:
          type: string
          format: date-time
          minLength: 1
          maxLength: 100
        description: Job created before filter
      - in: query
        name: sort
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4
          pattern: ^(ASC|DESC)$
        description: Sort jobs by created time ASC or DESC (default)
      - in: query
        name: tags
        required: false
        schema:
          $ref: '#/components/schemas/Tags'
        description: Tags to filter jobs
      - in: query
        name: session_id
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: ^.*$
        description: Session ID to filter jobs
      - in: query
        name: exclude_params
        required: false
        schema:
          type: boolean
          default: true
        description: Exclude job params from the response
      tags:
      - Jobs
      summary: List jobs
      operationId: list_jobs
      description: List the quantum program jobs you have run.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobsResponse'
              examples:
                jobsResponseExample:
                  $ref: '#/components/examples/jobsResponseExample'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.read
    post:
      tags:
      - Jobs
      summary: Run a job
      operationId: create_job
      parameters:
      - name: Parent-Job-Id
        in: header
        description: Parent job ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreateResponse'
              example:
                id: c5dge2d3rn7breq27i9g
                backend: ibm_backend
                private: true
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '409':
          description: Usage exceeds instance limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      description: Invoke a Qiskit Runtime primitive. Note the returned job ID. You will use it to check the job's status and review results. This request is rate limited to 5 jobs per minute per user.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/JobRunParams'
              - $ref: '#/components/schemas/JobRunParamsChannelPartner'
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.create
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.create
  /v1/jobs/{id}/results:
    parameters:
    - schema:
        type: string
        minLength: 1
        maxLength: 1000
        pattern: ^.*$
      name: id
      in: path
      required: true
      description: A job ID
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      summary: List job results
      tags:
      - Jobs
      description: Return the final result from this job.
      responses:
        '200':
          description: Returns the job's final result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResults'
        '204':
          description: Job's final result not found.
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      operationId: get_job_results_jid
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.read
  /v1/jobs/{id}/logs:
    parameters:
    - schema:
        type: string
        minLength: 1
        maxLength: 1000
        pattern: ^.*$
      name: id
      in: path
      required: true
      description: A job ID
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      operationId: get_jog_logs_jid
      summary: List job logs
      tags:
      - Jobs
      description: List all job logs for the specified job.
      responses:
        '200':
          description: Returns job logs.
          content:
            text/plain:
              schema:
                type: string
                description: Job logs.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.read
  /v1/jobs/{id}/cancel:
    parameters:
    - name: Parent-Job-Id
      in: header
      description: Parent job ID
      required: false
      schema:
        type: string
    - schema:
        type: string
        minLength: 1
        maxLength: 1000
        pattern: ^.*$
      name: id
      in: path
      required: true
      description: A job ID
    - $ref: '#/components/parameters/IBM-API-Version'
    post:
      summary: Cancel a job
      tags:
      - Jobs
      description: Cancels the specified job.
      responses:
        '204':
          description: OK
        '400':
          description: Bad cancel request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '409':
          description: Job is in non cancellable status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '500':
          description: Internal error cancelling job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      operationId: cancel_job_jid
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.cancel
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.cancel
  /v1/jobs/{id}/metrics:
    parameters:
    - schema:
        type: string
        minLength: 1
        maxLength: 1000
        pattern: ^.*$
      name: id
      in: path
      required: true
      description: A job ID
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      summary: Get job metrics
      tags:
      - Jobs
      description: Gets metrics of specified job
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobMetricsResponse'
              examples:
                jobResponseSample:
                  $ref: '#/components/examples/jobMetricsResponseExample'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      operationId: get_job_metrics_jid
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.read
  /v1/jobs/{id}/tags:
    parameters:
    - schema:
        type: string
        minLength: 1
        maxLength: 1000
        pattern: ^.*$
      name: id
      in: path
      required: true
      description: A job ID
    - $ref: '#/components/parameters/IBM-API-Version'
    put:
      tags:
      - Jobs
      summary: Replace job tags
      operationId: replace_job_tags
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Replace job tags request. Specify an empty array to clear tags.
              properties:
                tags:
                  $ref: '#/components/schemas/Tags'
              required:
              - tags
      responses:
        '204':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorContainer'
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.job.update
      x-ibm-permissions:
        actions:
        - name: quantum-computing.job.update
components:
  schemas:
    ExecutorV10StretchValueModel:
      description: 'Describes circuit stretch value resolutions.


        All timing information is expressed in terms of multiples of the quantity `dt`, time step

        duration of the control electronics, which can be queried in backend and target properties.'
      properties:
        name:
          description: The name of the stretch.
          title: Name
          type: string
        value:
          description: The resolved stretch value, up to the remainder, in units of `dt`.
          title: Value
          type: integer
        remainder:
          description: The time left over if `value` were to be used each stretch, in units of `dt`.
          title: Remainder
          type: integer
        expanded_values:
          description: 'A sequence of pairs `(time, duration)` indicating the time and duration of each delay.


            All units are `dt`, where the `time` denotes the absolute time of a delay in the circuit

            schedule, and the `duration` denotes the total duration of the delay.'
          items:
            maxItems: 2
            minItems: 2
            type: array
          title: Expanded Values
          type: array
      required:
      - name
      - value
      - remainder
      - expanded_values
      title: Executor v1.0 StretchValueModel
      type: object
    NoiseLearnerV3V01NoiseLearnerV3ResultsModel:
      description: Result from executing a noise learner v3 job.
      properties:
        schema_version:
          default: v0.1
          description: Schema version of the result type.
          title: Schema Version
          type: string
          enum:
          - v0.1
        data:
          description: Resulting data for each item.
          items:
            $ref: '#/components/schemas/NoiseLearnerV3V01NoiseLearnerV3ResultModel'
          title: Data
          type: array
      required:
      - data
      title: NoiseLearnerV3 v0.1 NoiseLearnerV3ResultsModel
      type: object
    ExecutorV02SamplexItemModel:
      description: Execution specifications for a single quantum circuit.
      properties:
        item_type:
          default: samplex
          description: The type of quantum program item.
          title: Item Type
          type: string
          enum:
          - samplex
        circuit:
          $ref: '#/components/schemas/QpyModelV13ToV17'
        samplex:
          $ref: '#/components/schemas/SamplexModelSSV1ToSSV2'
        samplex_arguments:
          additionalProperties:
            anyOf:
            - type: boolean
            - type: integer
            - $ref: '#/components/schemas/PauliLindbladMapModel'
            - $ref: '#/components/schemas/TensorModel'
          description: Arguments to the samplex.
          title: Samplex Arguments
          type: object
        shape:
          description: 'The shape of this item.


            This shape must extend (via broadcasting) the implicit shape of the `samplex_arguments`.

            The non-trivial axes it introduces enumerate randomizations.'
          items:
            type: integer
          title: Shape
          type: array
        chunk_size:
          anyOf:
          - minimum: 1
            type: integer
          - type: string
            enum:
            - auto
          default: auto
          description: 'The maximum number circuit arguments to bind to the circuit per shot loop.


            When `"auto"`, the number is chosen server-side with heuristics designed to optimize

            execution speed. A quantum program must have items where either all chunk sizes are

            integer-valued, or all chunk sizes are `"auto"`. Integer values are only allowed inside of

            session exection mode.'
          title: Chunk Size
      required:
      - circuit
      - samplex
      - samplex_arguments
      - shape
      title: SamplexItemModel
      type: object
    NoiseLearnerV3V03TREXResultMetadataModel:
      description: The metadata of a single TREX result of a noise learner v3 job.
      properties:
        learning_protocol:
          default: trex
          description: The learning protocol used to obtain this result.
          title: Learning Protocol
          type: string
          enum:
          - trex
        post_selection:
          $ref: '#/components/schemas/NoiseLearnerV3V03TREXResultPostSelectionMetadataModel'
      required:
      - post_selection
      title: NoiseLearnerV3 v0.3 TREXResultMetadataModel
      type: object
    ExecutorV10QuantumProgramModel:
      description: Model to store a quantum program.
      properties:
        shots:
          description: The number of shots for each individually bound circuit.
          minimum: 1
          title: Shots
          type: integer
        circuits:
          $ref: '#/components/schemas/QpyDataV13ToV17Model_QuantumCircuit_'
        items:
          description: Items of the program.
          items:
            discriminator:
              mapping:
                circuit: '#/components/schemas/ExecutorV10CircuitItemModel'
                samplex: '#/components/schemas/ExecutorV10SamplexItemModel'
              propertyName: item_type
            oneOf:
            - $ref: '#/components/schemas/ExecutorV10CircuitItemModel'
            - $ref: '#/components/schemas/ExecutorV10SamplexItemModel'
          title: Items
          type: array
        semantic_role:
          default: null
          description: 'Semantic role indicating how execution results may be post-processed by runtime clients.


            Reserved system values include ''sampler-v2'' and ''estimator-v2'', and are subject to change

            without notice. Third party clients should not set or depend on this value.'
          title: Semantic Role
          type:
          - string
          - 'null'
        meas_level:
          default: classified
          description: "The level at which to return all classical register measurement results.\n\nThis option sets the return type of all classical registers in all quantum program items and\ndetermines whether the raw complex data from low-level measurement devices is discriminated\ninto bits or not.\n\n - \"classified\": Classical register data is returned as boolean arrays with the intrinsic shape\n     `(num_shots, creg_size)`.\n - \"kerneled\": Classical register data is returned as a complex array with the intrinsic shape\n     `(num_shots, creg_size)`, where each entry represents an IQ data point (resulting from\n     kerneling the measurement trace) in arbitrary units.\n - \"avg_kerneled\": Classical register data is returned as a complex array with the intrinsic\n     shape `(creg_size,)`, where data is equivalent to \"kerneled\" except additionally averaged\n     over shots.\n - \"both\": Both classified and kerneled data is returned for every classical register."
          enum:
          - classified
          - kerneled
          - avg_kerneled
          - both
          title: Meas Level
          type: string
        passthrough_data:
          $ref: '#/components/schemas/ExecutorV10DataTree'
      required:
      - shots
      - circuits
      - items
      title: Executor v1.0 QuantumProgramModel
      type: object
    NoiseLearnerV3V02OptionsModel:
      description: Runtime options with all fields set.
      properties:
        shots_per_randomization:
          default: 128
          description: The total number of shots to use per randomized learning circuit.
          title: Shots Per Randomization
          type: integer
        num_randomizations:
          default: 32
          description: The number of random circuits to use per learning circuit configuration.
          title: Num Randomizations
          type: integer
        layer_pair_depths:
          default:
          - 0
          - 1
          - 2
          - 4
          - 16
          - 32
          description: The circuit depths (measured in number of pairs) to use in Pauli Lindblad experiments.
          items:
            type: integer
          title: Layer Pair Depths
          type: array
        post_selection:
          $ref: '#/components/schemas/NoiseLearnerV3V02PostSelectionOptionsModel'
        init_qubits:
          default: true
          description: Whether to reset the qubits to the ground state for each shot.
          title: Init Qubits
          type: boolean
        rep_delay:
          default: null
          description: 'The repetition delay.


            This is the delay between the end of one circuit and the start of the next within a shot loop.

            This is only supported on backends that have `backend.dynamic_reprate_enabled=True`. It must

            be from the range supplied by `backend.rep_delay_range`. When this value is `None`, the

            default value `backend.default_rep_delay` is used.'
          title: Rep Delay
          type:
          - number
          - 'null'
      title: OptionsModel
      type: object
    NoiseLearnerV3V03TREXResultPostSelectionMetadataModel:
      description: The post selection metadata of a single TREX result of a noise learner v3 job.
      properties:
        fraction_kept:
          description: The fraction of shots kept.
          maximum: 1
          minimum: 0
          title: Fraction Kept
          type: number
        success_rates:
          additionalProperties:
            maximum: 1
            minimum: 0
            type: number
          description: The fraction of shots in which post selection successfully flipped each qubit.
          title: Success Rates
          type: object
      required:
      - fraction_kept
      - success_rates
      title: NoiseLearnerV3 v0.3 TREXResultPostSelectionMetadataModel
      type: object
    ExecutorV02MetadataModel:
      description: Execution metadata.
      properties:
        chunk_timing:
          description: Timing information about all executed chunks of a quantum program.
          items:
            $ref: '#/components/schemas/ChunkSpan'
          title: Chunk Timing
          type: array
      required:
      - chunk_timing
      title: MetadataModel
      type: object
    NoiseLearnerV3V01LinbdbladResultMetadataModel:
      description: The metadata of a single Lindblad result of a noise learner v3 job.
      properties:
        learning_protocol:
          default: lindblad
          description: The learning protocol used to obtain this result.
          title: Learning Protocol
          type: string
          enum:
          - lindblad
        post_selection:
          $ref: '#/components/schemas/NoiseLearnerV3V01LinbdbladResultPostSelectionMetadataModel'
      required:
      - post_selection
      title: LinbdbladResultMetadataModel
      type: object
    ExecutorV11SamplexItemModel:
      description: 'Execution specifications for a single quantum circuit.


        The circuit for each item is store separately in `QuantumProgramModel`.'
      properties:
        item_type:
          default: samplex
          description: The type of quantum program item.
          title: Item Type
          type: string
          enum:
          - samplex
        samplex:
          $ref: '#/components/schemas/SamplexModelSSV1ToSSV4'
        samplex_arguments:
          additionalProperties:
            anyOf:
            - type: boolean
            - type: integer
            - $ref: '#/components/schemas/PauliLindbladMapModel'
            - $ref: '#/components/schemas/TensorModel'
          description: Arguments to the samplex.
          title: Samplex Arguments
          type: object
        shape:
          description: 'The shape of this item.


            This shape must extend (via broadcasting) the implicit shape of the `samplex_arguments`.

            The non-trivial axes it introduces enumerate randomizations.'
          items:
            type: integer
          title: Shape
          type: array
        chunk_size:
          anyOf:
          - minimum: 1
            type: integer
          - type: string
            enum:
            - auto
          default: auto
          description: 'The maximum number circuit arguments to bind to the circuit per shot loop.


            When `"auto"`, the number is chosen server-side with heuristics designed to optimize

            execution speed. A quantum program must have items where either all chunk sizes are

            integer-valued, or all chunk sizes are `"auto"`. Integer values are only allowed inside of

            session exection mode.'
          title: Chunk Size
      required:
      - samplex
      - samplex_arguments
      - shape
      title: Executor v1.1 SamplexItemModel
      type: object
    ExecutorV01QuantumProgramResultItemModel:
      description: Results for a single quantum program item.
      properties:
        results:
          additionalProperties:
            $ref: '#/components/schemas/TensorModel'
          description: A map from results to their tensor values.
          title: Results
          type: object
        metadata:
