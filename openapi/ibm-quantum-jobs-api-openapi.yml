      - samplex_json
      title: SamplexModelSSV1ToSSV2
      type: object
    RemoteStorage:
      allOf:
      - allOf:
        - $ref: '#/components/schemas/RemoteStorageOption'
        - description: Default remote storage option for where input data is stored and where output data should be stored
      - title: RemoteStorage
        description: "(Only enabled for Qiskit Runtime instances with the Channel Partner plan) Metadata and connection information on where job params are stored remotely\nand/or where to store results, logs, transpiled circuits, etc. Omitted properties\nin field specific objects will be inherited from the default remote storage option.\nAs an example, the following two objects are equivalent:\n\n```\n{\n    \"type\": \"ibmcloud_cos\",\n    \"region\": \"us-east\",\n    \"region_type\": \"regional\",\n    \"bucket_crn\": \"crn\",\n    \"job_params\": {\n      \"object_name\": \"my-object\"\n    }\n}\n```\n\n```\n{\n    \"type\": \"ibmcloud_cos\",\n    \"region\": \"us-east\",\n    \"region_type\": \"regional\",\n    \"bucket_crn\": \"crn\",\n    \"job_params\": {\n      \"type\": \"ibmcloud_cos\",\n      \"region\": \"us-east\",\n      \"region_type\": \"regional\",\n      \"bucket_crn\": \"crn\",\n      \"object_name\": \"my-object\"\n    }\n}\n```\n"
        properties:
          job_params:
            allOf:
            - $ref: '#/components/schemas/RemoteStorageOption'
            - description: Location for where user supplied job params (omitted properties will will be inherited from default remote storage option)
          results:
            allOf:
            - $ref: '#/components/schemas/RemoteStorageOption'
            - description: Location for where job results will be stored (omitted properties will will be inherited from default remote storage option)
          logs:
            allOf:
            - $ref: '#/components/schemas/RemoteStorageOption'
            - description: Location for where job logs will be stored (omitted properties will will be inherited from default remote storage option)
        required:
        - job_params
        - results
    ExecutorV11QuantumProgramModel:
      description: Model to store a quantum program.
      properties:
        shots:
          description: The number of shots for each individually bound circuit.
          minimum: 1
          title: Shots
          type: integer
        circuits:
          $ref: '#/components/schemas/QpyDataV13ToV17Model_QuantumCircuit_'
        items:
          description: Items of the program.
          items:
            discriminator:
              mapping:
                circuit: '#/components/schemas/ExecutorV11CircuitItemModel'
                samplex: '#/components/schemas/ExecutorV11SamplexItemModel'
              propertyName: item_type
            oneOf:
            - $ref: '#/components/schemas/ExecutorV11CircuitItemModel'
            - $ref: '#/components/schemas/ExecutorV11SamplexItemModel'
          title: Items
          type: array
        semantic_role:
          default: null
          description: 'Semantic role indicating how execution results may be post-processed by runtime clients.


            Reserved system values include ''sampler-v2'' and ''estimator-v2'', and are subject to change

            without notice. Third party clients should not set or depend on this value.'
          title: Semantic Role
          type:
          - string
          - 'null'
        meas_level:
          default: classified
          description: "The level at which to return all classical register measurement results.\n\nThis option sets the return type of all classical registers in all quantum program items and\ndetermines whether the raw complex data from low-level measurement devices is discriminated\ninto bits or not.\n\n - \"classified\": Classical register data is returned as boolean arrays with the intrinsic shape\n     `(num_shots, creg_size)`.\n - \"kerneled\": Classical register data is returned as a complex array with the intrinsic shape\n     `(num_shots, creg_size)`, where each entry represents an IQ data point (resulting from\n     kerneling the measurement trace) in arbitrary units.\n - \"avg_kerneled\": Classical register data is returned as a complex array with the intrinsic\n     shape `(creg_size,)`, where data is equivalent to \"kerneled\" except additionally averaged\n     over shots.\n - \"both\": Both classified and kerneled data is returned for every classical register."
          enum:
          - classified
          - kerneled
          - avg_kerneled
          - both
          title: Meas Level
          type: string
        passthrough_data:
          $ref: '#/components/schemas/ExecutorV11DataTree'
      required:
      - shots
      - circuits
      - items
      title: Executor v1.1 QuantumProgramModel
      type: object
