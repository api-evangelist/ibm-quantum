      - dtype
      title: CompressedTensorModel
      type: object
    TensorModel:
      description: Model of tensor data.
      properties:
        data:
          description: 'Base-64-encoded data in litte endian format.


            Bool arrays are bitpacked, other types are IEEE753. Everything is little-endian.

            Tensors are C-ordering.'
          title: Data
