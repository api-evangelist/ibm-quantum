    ExecutorV10ChunkPart:
      description: A description of the contents of a single part of an execution chunk.
      properties:
        idx_item:
          description: The index of an item in a quantum program.
          title: Idx Item
          type: integer
        size:
          description: 'The number of elements from the quantum program item that were executed.


            For example, if a quantum program item has shape `(10, 5)`, then it has a total of `50`

            elements, so that if this `size` is `10`, it constitutes 20% of the total work for the item.'
          title: Size
          type: integer
        permutation:
          description: 'A permutation vector of the item shape before slicing elements with the `element_range`.


            This list should hold contiguous integers starting at 0, in some order. The convention is

            that `permuted_shape[i] = shape[permutation[i]]` for every dimension index `i`.'
          items:
            type: integer
          title: Permutation
          type: array
        element_range:
          description: 'Which elements of the item were executed in this chunk part.


            This range has entries `(start_idx, stop_idx, step)` that slice the flattened shape of the

            corresponding quantum program item, after the `permutation` has been applied. That is,

            this part corresponds to the data elements `flatten(permute(arr))[start_idx:stop_idx:step]`

            for some data array `arr` whose shape matches the corresponding item shape. The lower index

            is inclusive, the upper index is exclusive, and the step must be positive.


            It should hold that `size == max(0, ceil((stop_idx - start_idx) / step))`.'
          maxItems: 3
          minItems: 3
          title: Element Range
          type: array
      required:
      - idx_item
      - size
      - permutation
      - element_range
      title: Executor v1.0 ChunkPart
      type: object
    SamplexModelSSV1ToSSV2:
      description: A samplex model constrained to use samplex serialization versions (SSV) 1 or 2.
      properties:
        ssv:
          maximum: 2
          minimum: 1
