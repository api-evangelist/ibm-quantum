            type: number
          description: The fraction of shots kept for each layer pair depth.
          title: Fraction Kept
          type: object
        success_rates:
          additionalProperties:
            additionalProperties:
              maximum: 1
              minimum: 0
              type: number
            type: object
          description: 'The fraction of shots in which post selection successfully flipped each qubit, for

            each layer pair depth.'
          title: Success Rates
          type: object
      required:
      - fraction_kept
      - success_rates
      title: NoiseLearnerV3 v0.3 LinbdbladResultPostSelectionMetadataModel
      type: object
    JobRunParamsEstimator:
      title: EstimatorV2 input
      description: The input for an EstimatorV2 API call
      type: object
      required:
      - pubs
      properties:
        pubs:
          type: array
          description: Primitive Unit Blocs of data. Each PUB is of the form (Circuit, Observables, Parameters, Precision) where the circuit and observables are required, parameters should be passed only for parametrized circuits, and precision is optional
          items:
            type: array
            minItems: 2
            items: {}
            x-prefixItems:
            - description: The quantum circuit in QASM string or base64-encoded QPY format. See https://docs.quantum.ibm.com/api/qiskit/qpy for more details on QPY.
            - description: One or more observables, which can be given as strings.
            - description: The parameter values. The keys are the names of the parameters, and the values are the actual parameter values.
            - description: The precision for this specific PUB
              type:
              - number
              - 'null'
        options:
          type: object
          description: Options for V2 Estimator
          properties:
            seed_estimator:
              description: Seed used to control sampling
              type:
              - integer
              - 'null'
              format: int32
              minimum: 0
              maximum: 2147483647
            default_precision:
              description: The default precision to use if a precision is not specified for a PUB or for this job.
              type: number
              exclusiveMinimum: 0
            default_shots:
              description: The total number of shots to use per circuit per configuration. If set, this value overrides default_precision.
              type:
              - integer
              - 'null'
              format: int32
              minimum: 0
              maximum: 2147483647
            dynamical_decoupling:
              description: Suboptions for dynamical decoupling
              type: object
              properties:
                enable:
                  description: Whether to enable dynamical decoupling.
                  type: boolean
                sequence_type:
                  description: Which dynamical decoupling sequence to use
                  type: string
                  enum:
                  - XX
                  - XpXm
                  - XY4
                extra_slack_distribution:
                  description: Where to put extra timing delays due to rounding issues
                  type: string
                  enum:
                  - middle
                  - edges
                scheduling_method:
                  description: Whether to schedule gates as soon as ('asap') or as late as ('alap') possible
                  type: string
                  enum:
                  - alap
                  - asap
                skip_reset_qubits:
                  description: Whether to insert DD on idle periods that immediately follow initialized/reset qubits.
                  type: boolean
            resilience:
              description: Advanced resilience options to fine tune the resilience strategy
              type: object
              properties:
                measure_mitigation:
                  description: Whether to enable measurement error mitigation method
                  type: boolean
                measure_noise_learning:
                  description: Additional measurement noise learning options
                  type: object
                  properties:
                    num_randomizations:
                      description: The number of random circuits to draw for the measurement learning experiment
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 2147483647
                    shots_per_randomization:
                      description: The number of shots to use for the learning experiment per random circuit.
                      oneOf:
                      - type: integer
                        format: int32
                        minimum: 1
                        maximum: 2147483647
                      - enum:
                        - auto
                zne_mitigation:
                  description: Whether to turn on Zero Noise Extrapolation error mitigation method
                  type: boolean
                zne:
                  description: Additional zero noise extrapolation mitigation options
                  type: object
                  properties:
                    noise_factors:
                      description: A list of floats representing noise factors to use for noise amplification
                      x-$comment: We do not specify a type so that can maintain support for NumPy inputs.
                    extrapolator:
                      description: Extrapolator(s) to try (in order) for extrapolating to zero noise
                      oneOf:
                      - type: array
                        items:
                          type: string
                          enum:
                          - linear
                          - exponential
                          - double_exponential
                          - polynomial_degree_1
                          - polynomial_degree_2
                          - polynomial_degree_3
                          - polynomial_degree_4
                          - polynomial_degree_5
                          - polynomial_degree_6
                          - polynomial_degree_7
                          - fallback
                      - type: string
                        enum:
                        - linear
                        - exponential
                        - double_exponential
                        - polynomial_degree_1
                        - polynomial_degree_2
                        - polynomial_degree_3
                        - polynomial_degree_4
                        - polynomial_degree_5
                        - polynomial_degree_6
                        - polynomial_degree_7
                        - fallback
                    amplifier:
                      description: Technique to use for amplifying noise.
                      type: string
                      enum:
                      - gate_folding
                      - gate_folding_front
                      - gate_folding_back
                      - pea
                    extrapolated_noise_factors:
                      description: A list of floats representing noise factors to evaluate the fit extrapolation models at, or the string 'auto' to set them based on the noise factors.
                      x-$comment: We do not specify a type so that can maintain support for NumPy inputs.
                pec_mitigation:
                  description: Whether to turn on Probabilistic Error Cancellation error mitigation method
                  type: boolean
                pec:
                  description: Additional probabilistic error cancellation mitigation options
                  type: object
                  properties:
                    max_overhead:
                      description: The maximum circuit sampling overhead allowed
                      oneOf:
                      - type:
                        - number
                        - 'null'
                        exclusiveMinimum: 0
                    noise_gain:
                      description: The amount by which to scale the noise
                      oneOf:
                      - type: number
                        minimum: 0
                      - enum:
                        - auto
                layer_noise_learning:
                  description: Layer noise learning options
                  type: object
                  properties:
                    max_layers_to_learn:
                      description: The max number of unique layers to learn
                      type:
                      - integer
                      - 'null'
                      format: int32
                      minimum: 0
                      maximum: 2147483647
                    shots_per_randomization:
                      description: The total number of shots to use per random learning circuit
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 2147483647
                    num_randomizations:
                      description: The number of random circuits to use per learning circuit configuration
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 2147483647
                    layer_pair_depths:
                      description: A list of integers representing the circuit depths (measured in number of pairs) to use in learning experiments
                      x-$comment: We do not specify a type so that can maintain support for NumPy inputs.
                layer_noise_model:
                  description: A NoiseLearnerResult or a sequence of LayerError objects, or ``None`` to invoke a noise-learning stage when necessary.
                  x-$comment: We do not specify a type to accomodate inputs directly in the format of NoiseLearnerResult.
            execution:
              description: Execution options
              type: object
              properties:
                init_qubits:
                  description: Whether to reset the qubits to the ground state for each shot
                  type: boolean
                rep_delay:
                  description: The delay between a measurement and the subsequent quantum circuit
                  type: number
            twirling:
              description: Twirling options
              type: object
              properties:
                enable_gates:
                  description: Whether to apply 2-qubit gate twirling
                  type: boolean
                enable_measure:
                  description: Whether to apply measurement twirling
                  type: boolean
                num_randomizations:
                  description: The number of random samples to use when twirling or performing sampled mitigation
                  oneOf:
                  - type: integer
                    format: int32
                    minimum: 1
                    maximum: 2147483647
                  - enum:
                    - auto
                shots_per_randomization:
                  description: The number of shots to run for each random sample
                  oneOf:
                  - type: integer
                    format: int32
                    minimum: 1
                    maximum: 2147483647
                  - enum:
                    - auto
                strategy:
                  description: The strategy of twirling qubits in identified layers of 2-qubit twirled gates
                  type: string
                  enum:
                  - active
                  - active-circuit
                  - active-accum
                  - all
            simulator:
              description: Simulator options
              type: object
              properties:
                noise_model:
                  description: Noise model for the simulator.
                  type:
                  - object
                  - 'null'
                seed_simulator:
                  description: Random seed to control sampling.
                  type:
                  - integer
                  - 'null'
                  format: int32
                  minimum: 0
                  maximum: 2147483647
                coupling_map:
                  description: Directed coupling map to target in mapping.
                  type:
                  - array
                  - 'null'
                  items: {}
                basis_gates:
                  description: List of basis gate names to unroll to.
                  type: array
                  items:
                    type:
                    - string
                    - 'null'
              additionalProperties: false
            experimental:
              description: Experimental options.
              type: object
          additionalProperties: false
        resilience_level:
          description: How much resilience to build against errors
          type: integer
          format: int32
          minimum: 0
          maximum: 2
        precision:
          description: Default precision level which applies to all PUBs without precision. This overrides default_precision and default_shots specified in options.
          type:
          - number
          - 'null'
          exclusiveMinimum: 0
        support_qiskit:
          description: If True, returns a qiskit-style output, meant to be parsed using the runtime result decoder, or resort to returning pure JSON results (resulting in larger objects)
          type: boolean
        version:
          description: For EstimatorV2, version should always be 2
          enum:
          - 2
      additionalProperties: false
      x-version: 1.0.0
    ExecutorV01SamplexItemModel:
      description: Execution specifications for a single quantum circuit.
      properties:
        item_type:
          default: samplex
          description: The type of quantum program item.
          title: Item Type
          type: string
          enum:
          - samplex
