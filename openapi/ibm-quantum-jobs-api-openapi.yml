    PreCircuitBitFlipChecksOptionsModel:
      description: Options to apply pre-circuit bit-flip checks to the results of noise learning circuits.
      properties:
        enable:
          default: false
          description: 'Whether to apply pre-circuit bit-flip checks.


            If `False`, all the other fields will be ignored.'
          title: Enable
