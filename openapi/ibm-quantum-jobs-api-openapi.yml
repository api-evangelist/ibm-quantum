          title: X Pulse Type
          type: string
        strategy:
          default: node
          description: "The strategy used to decide if a shot should be kept or discarded.\n\nThe available strategies are:\n\n* `'node'`: Discard every shot where one or more bits failed to flip. Keep every other shot.\n* `'edge'`: Discard every shot where there exists a pair of neighbouring qubits for which\n  both of the bits failed to flip. Keep every other shot."
          enum:
          - node
          - edge
          title: Strategy
          type: string
      title: NoiseLearnerV3 v0.3 PreCircuitBitFlipChecksOptionsModel
      type: object
    ExecutorV01ParamsModel:
