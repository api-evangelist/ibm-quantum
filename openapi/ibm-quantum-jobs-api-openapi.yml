          example: crn:v1:bluemix:public:cloud-object-storage:global:a/abc123:abc123:bucket:my-bucket
        object_name:
          description: Name/ID of the object in the IBM Cloud Object Storage bucket. May *not* be specified in the default remote storage option.
          type: string
      required:
      - object_name
      - bucket_crn
      - region
      - region_type
    UsageV3:
      title: usage
      description: usage metrics
      type: object
      properties:
        qpu_charge_time_seconds:
          type: number
          description: The amount of resource usage in seconds. This value is used to calculate capacity consumption.
          minimum: 0
        value:
          type: number
          description: The amount of resource usage in resource units. This value is used to calculate capacity consumption.
          minimum: 0
        unit:
          type: string
          description: The unit of the value field.
          enum:
          - resource_units
        status:
          $ref: '#/components/schemas/BillingStatus'
        details:
          type: array
          description: A breakdown of the usage by metric.
          minItems: 1
          maxItems: 256
          items:
            $ref: '#/components/schemas/UsageDetail'
    NoiseLearnerV3V01NoiseLearnerV3ResultModel:
      description: Results for a single noise learner V3 item.
      properties:
        generators_sparse:
          description: A representation of the generators in sparse format.
          items:
            items:
              maxItems: 2
              minItems: 2
              type: array
            type: array
          title: Generators Sparse
          type: array
        num_qubits:
          description: The number of qubits that the generators act on.
          title: Num Qubits
          type: integer
        rates:
          $ref: '#/components/schemas/F64TensorModel'
        rates_std:
          $ref: '#/components/schemas/F64TensorModel'
        metadata:
          description: Execution metadata pertaining to a single result.
          discriminator:
            mapping:
              lindblad: '#/components/schemas/NoiseLearnerV3V01LinbdbladResultMetadataModel'
              trex: '#/components/schemas/NoiseLearnerV3V01TREXResultMetadataModel'
            propertyName: learning_protocol
          oneOf:
          - $ref: '#/components/schemas/NoiseLearnerV3V01TREXResultMetadataModel'
          - $ref: '#/components/schemas/NoiseLearnerV3V01LinbdbladResultMetadataModel'
          title: Metadata
      required:
      - generators_sparse
      - num_qubits
      - rates
      - rates_std
      - metadata
      title: NoiseLearnerV3ResultModel
      type: object
    ExecutorV11ChunkSpan:
      description: 'Timing information about a single chunk of execution.


        > **Note:** This span may include some amount of non-circuit time.'
      properties:
        start:
          description: The start time of the execution chunk in UTC.
          format: date-time
          title: Start
          type: string
        stop:
          description: The stop time of the execution chunk in UTC.
          format: date-time
          title: Stop
          type: string
        parts:
          description: A description of which parts of a quantum program are contained in this chunk.
          items:
            $ref: '#/components/schemas/ExecutorV11ChunkPart'
          title: Parts
          type: array
      required:
      - start
      - stop
      - parts
      title: Executor v1.1 ChunkSpan
      type: object
    ExecutorV11OptionsModel:
      description: Runtime options.
      properties:
        init_qubits:
          default: true
          description: Whether to reset the qubits to the ground state for each shot.
          title: Init Qubits
          type: boolean
        rep_delay:
          default: null
          description: 'The repetition delay.


            This is the delay between the end of one circuit and the start of the next within a shot loop.

            This is only supported on backends that have `backend.dynamic_reprate_enabled=True`. It must

            be from the range supplied by `backend.rep_delay_range`. When this value is `None`, the

            default value `backend.default_rep_delay` is used.'
          title: Rep Delay
          type:
          - number
          - 'null'
        scheduler_timing:
          default: false
          description: 'Whether to return circuit schedule timing of each provided quantum circuit.


            Setting this value to true will cause corresponding metadata of every program item to be

            populated in the returned data.'
          title: Scheduler Timing
          type: boolean
        stretch_values:
          default: false
          description: 'Whether to return numeric resolutions of stretches for each provided quantum circuit.


            Setting this value to true will cause corresponding metadata of every program item to be

            populated in the returned data.'
          title: Stretch Values
          type: boolean
        experimental:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          default: {}
          description: 'Experimental options.


            These options are not guaranteed to be stable and may change or be removed without notice.'
          title: Experimental
          type: object
      title: Executor v1.1 OptionsModel
      type: object
    NoiseLearnerV3V03ParamsModel:
      description: A model describing the Noise Learner V3 program inputs.
      properties:
        schema_version:
          default: v0.3
          title: Schema Version
          type: string
          enum:
          - v0.3
        instructions:
          $ref: '#/components/schemas/QpyModelV13ToV17'
        options:
          $ref: '#/components/schemas/NoiseLearnerV3V03OptionsModel'
      required:
      - instructions
      - options
      title: NoiseLearnerV3 v0.3 ParamsModel
      type: object
    ExecutorV11ChunkPart:
      description: A description of the contents of a single part of an execution chunk.
      properties:
        idx_item:
          description: The index of an item in a quantum program.
          title: Idx Item
          type: integer
        size:
          description: 'The number of elements from the quantum program item that were executed.


            For example, if a quantum program item has shape `(10, 5)`, then it has a total of `50`

            elements, so that if this `size` is `10`, it constitutes 20% of the total work for the item.'
          title: Size
          type: integer
        permutation:
          description: 'A permutation vector of the item shape before slicing elements with the `element_range`.


            This list should hold contiguous integers starting at 0, in some order. The convention is

            that `permuted_shape[i] = shape[permutation[i]]` for every dimension index `i`.'
          items:
            type: integer
          title: Permutation
          type: array
        element_range:
          description: 'Which elements of the item were executed in this chunk part.


            This range has entries `(start_idx, stop_idx, step)` that slice the flattened shape of the

            corresponding quantum program item, after the `permutation` has been applied. That is,

            this part corresponds to the data elements `flatten(permute(arr))[start_idx:stop_idx:step]`

            for some data array `arr` whose shape matches the corresponding item shape. The lower index

            is inclusive, the upper index is exclusive, and the step must be positive.


            It should hold that `size == max(0, ceil((stop_idx - start_idx) / step))`.'
          maxItems: 3
          minItems: 3
          title: Element Range
          type: array
      required:
      - idx_item
      - size
      - permutation
      - element_range
      title: Executor v1.1 ChunkPart
      type: object
    CompressedQpyDataModel_QuantumCircuit_:
      properties:
        b64_data:
          description: Base-64 encoded data of the QPY serialization of some Qiskit objects.
          title: B64 Data
          type: string
        qpy_version:
          description: The QPY encoding version.
          minimum: 10
          title: Qpy Version
          type: integer
        num_programs:
          description: The number of distinct elements in the Python encoding.
          minimum: 1
          title: Num Programs
          type: integer
      required:
      - b64_data
      - qpy_version
      - num_programs
      title: CompressedQpyDataModel[QuantumCircuit]
      type: object
    ExecutorV02QuantumProgramModel:
      description: Model to store a quantum program.
      properties:
        shots:
          description: The number of shots for each individually bound circuit.
          minimum: 1
          title: Shots
          type: integer
        items:
          description: Items of the program.
          items:
            discriminator:
              mapping:
                circuit: '#/components/schemas/ExecutorV02CircuitItemModel'
                samplex: '#/components/schemas/ExecutorV02SamplexItemModel'
              propertyName: item_type
            oneOf:
            - $ref: '#/components/schemas/ExecutorV02CircuitItemModel'
            - $ref: '#/components/schemas/ExecutorV02SamplexItemModel'
          title: Items
          type: array
        meas_level:
          default: classified
          description: "The level at which to return all classical register measurement results.\n\nThis option sets the return type of all classical registers in all quantum program items and\ndetermines whether the raw complex data from low-level measurement devices is discriminated\ninto bits or not.\n\n - \"classified\": Classical register data is returned as boolean arrays with the intrinsic shape\n     `(num_shots, creg_size)`.\n - \"kerneled\": Classical register data is returned as a complex array with the intrinsic shape\n     `(num_shots, creg_size)`, where each entry represents an IQ data point (resulting from\n     kerneling the measurement trace) in arbitrary units.\n - \"avg_kerneled\": Classical register data is returned as a complex array with the intrinsic\n     shape `(creg_size,)`, where data is equivalent to \"kerneled\" except additionally averaged\n     over shots."
          enum:
          - classified
          - kerneled
          - avg_kerneled
          title: Meas Level
          type: string
        passthrough_data:
          $ref: '#/components/schemas/ExecutorV02DataTree'
      required:
      - shots
      - items
      title: QuantumProgramModel
      type: object
    ExecutorV01QuantumProgramResultModel:
      description: Result from executing a quantum program.
      properties:
        schema_version:
          default: v0.1
          description: Schema version of the result type.
          title: Schema Version
          type: string
          enum:
          - v0.1
        data:
          description: Resulting data for each quantum program item.
          items:
            $ref: '#/components/schemas/ExecutorV01QuantumProgramResultItemModel'
          title: Data
          type: array
        metadata:
          $ref: '#/components/schemas/ExecutorV01MetadataModel'
      required:
      - data
      - metadata
      title: ExecutorV01QuantumProgramResultModel
      type: object
    Timestamps:
      type: object
      description: A map of status transitions to timestamps
      properties:
        created:
          pattern: ^[0-9TZt:\-+./*]+$
          format: date-time
          type: string
          description: Timestamp of when the job create request was received
        finished:
          pattern: ^[0-9TZt:\-+./*]+$
          format: date-time
          type: string
          description: Timestamp of when the job finished
        running:
          pattern: ^[0-9TZt:\-+./*]+$
          format: date-time
          type: string
          description: Timestamp of when the job started running
