openapi: 3.2.0
info:
  title: Qiskit Runtime Backends API
  description: The Qiskit Runtime API description
  version: 0.56.3
  contact: {}
  x-ibm-changelog: '- `GET /api/v1/jobs/:id/metrics` and `GET /api/v1/jobs` return usage data using a different response format. The APIs no longer return the response properties `usage.circuits_execution_time_ns`. Now `GET /api/v1/jobs/:id/metrics` will return `circuits_execution_time_ns` at response root level.'
servers:
- url: /api
tags:
- name: Backends
paths:
  /v1/backends:
    parameters:
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      tags:
      - Backends
      summary: List your backends
      operationId: list_backends
      parameters:
      - in: query
        name: fields
        required: false
        schema:
          description: A comma-separated list of fields to return in the response. Initially only supports conditionally returning the `wait_time_seconds` property.
          type: string
          enum:
          - wait_time_seconds
          default: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendsResponse'
              examples:
                sampleBackendsResponse:
                  $ref: '#/components/examples/backendsResponseExample'
      description: Returns a list of all the backends your service instance has access to.
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.device.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.device.read
  /v1/backends/{id}/properties:
    parameters:
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      tags:
      - Backends
      summary: Get backend properties
      operationId: get_backend_properties
      parameters:
      - schema:
          type: string
          pattern: ^.*$
          minLength: 1
          maxLength: 500
        name: id
        description: Identifier of an available backend
        in: path
        required: true
      - in: query
        name: updated_before
        required: false
        schema:
          type: string
          format: date-time
          minLength: 1
          maxLength: 100
        description: Returns properties with last_update_date before the given time.
      - in: query
        name: calibration_id
        required: false
        schema:
          type: string
          pattern: ^.*$
          minLength: 1
          maxLength: 100
        description: Returns properties associated with the given calibration ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendPropertiesResponse'
              examples:
                sampleBackendPropertiesResponse:
                  $ref: '#/components/examples/sampleBackendPropertiesResponse'
      description: Returns the properties for the specified backend. Simulator backends may not support this.
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.device.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.device.read
  /v1/backends/{id}/configuration:
    parameters:
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      tags:
      - Backends
      summary: Get backend configuration
      operationId: get_backend_configuration
      parameters:
      - schema:
          type: string
          pattern: ^.*$
          minLength: 1
          maxLength: 500
        name: id
        description: Identifier of an available backend
        in: path
        required: true
      - in: query
        name: calibration_id
        required: false
        schema:
          type: string
          pattern: ^.*$
          minLength: 1
          maxLength: 100
        description: Returns configuration associated with the given calibration ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendConfigurationResponse'
              examples:
                sampleBackendConfigurationResponse:
                  $ref: '#/components/examples/sampleBackendConfigurationResponse'
      description: Returns the configuration for the specified backend.
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.device.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.device.read
  /v1/backends/{id}/status:
    parameters:
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      tags:
      - Backends
      summary: Get backend status
      operationId: get_backend_status
      parameters:
      - schema:
          type: string
          pattern: ^.*$
          minLength: 1
          maxLength: 500
        name: id
        description: Identifier of an available backend
        in: path
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendStatusResponse'
              examples:
                sampleBackendStatusResponse:
                  $ref: '#/components/examples/sampleBackendStatusResponse'
      description: Returns the status for the specified backend ID.
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.device.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.device.read
  /v1/backends/{id}/defaults:
    parameters:
    - $ref: '#/components/parameters/IBM-API-Version'
    get:
      tags:
      - Backends
      summary: Get backend default settings
      operationId: get_backend_defaults
      parameters:
      - schema:
          type: string
          pattern: ^.*$
          minLength: 1
          maxLength: 500
        name: id
        description: Identifier of an available backend
        in: path
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendDefaultsResponse'
              examples:
                sampleBackendDefaultsResponse:
                  $ref: '#/components/examples/sampleBackendDefaultsResponse'
      description: Returns the defaults for the specified backend. Simulator backends may not support this.
      security:
      - IBMCloudAPIKey: []
      - ServiceCRN: []
      - IBMCloudAuth: []
      x-ibm-events:
        events:
        - name: quantum-computing.device.read
      x-ibm-permissions:
        actions:
        - name: quantum-computing.device.read
