          - _SUM[i,0,4,wq{i}/2*(I{i}-Z{i})]
          - _SUM[i,0,4,delta{i}/2*O{i}*O{i}]
          - _SUM[i,0,4,-delta{i}/2*O{i}]
          - _SUM[i,0,4,omegad{i}*X{i}||D{i}]
          - jq0q1*Sp0*Sm1
          - jq0q1*Sm0*Sp1
          - jq1q2*Sp1*Sm2
